<!doctype html>
<!--
  POST TEMPLATE
  =============
  To publish a new post:
    1. Copy this file to blog/your-post-slug.html
    2. Search it for POST_TITLE, POST_DESCRIPTION, POST_SLUG and the two
       dates, and replace every occurrence.
    3. Write the post inside <div class="post-body">.
    4. Add a matching <li> at the TOP of the list in blog/index.html
       (and optionally in the Writing section of index.html).
  This file is unlinked from the site; nothing points at it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>POST_TITLE — Your Name</title>
    <meta name="description" content="POST_DESCRIPTION" />

    <link
      rel="canonical"
      href="https://wceriale.github.io/site/blog/POST_SLUG.html"
    />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="POST_TITLE" />
    <meta property="og:description" content="POST_DESCRIPTION" />
    <meta property="article:published_time" content="2026-01-01" />

    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/style.css" />

    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t) document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="wrap">
      <header class="site-header">
        <a class="home" href="../">Your Name</a>
        <nav class="site-nav" aria-label="Primary">
          <a href="../">Home</a>
          <a href="./">Writing</a>
          <button class="theme-toggle" type="button">
            <span class="icon-light" aria-hidden="true">Dark</span>
            <span class="icon-dark" aria-hidden="true">Light</span>
          </button>
        </nav>
      </header>

      <main id="main">
        <article>
          <header class="post-header">
            <h1>POST_TITLE</h1>
            <p class="post-date">
              <time datetime="2026-01-01">January 1, 2026</time>
            </p>
          </header>

          <div class="post-body">
            <p>Write the post here.</p>
          </div>

          <nav class="post-nav">
            <a href="./">&larr; All writing</a>
          </nav>
        </article>
      </main>

      <footer class="site-footer">
        <span>&copy; 2026 Your Name</span>
        <span><a href="https://github.com/wceriale/site">Source</a></span>
      </footer>
    </div>

    <script src="../assets/js/theme.js"></script>
  </body>
</html>
