<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img"
     aria-label="A bar chart of candidate next tokens and their probabilities: on 0.41, down 0.22, quietly 0.14, still 0.09, and a long tail.">
  <!-- PLACEHOLDER FIGURE. Replace with your own diagram. -->
  <style>
    .bar  { fill: #6f9de8; }
    .tail { fill: #6f9de8; opacity: .35; }
    .lbl  { font: 13px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            fill: #8a9099; }
    .val  { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #8a9099; }
    .axis { stroke: #8a9099; stroke-width: 1; opacity: .5; }
  </style>

  <line class="axis" x1="110" y1="12" x2="110" y2="188" />

  <rect class="bar"  x="112" y="20"  width="246" height="22" />
  <text class="lbl"  x="102" y="36" text-anchor="end">“on”</text>
  <text class="val"  x="368" y="36">0.41</text>

  <rect class="bar"  x="112" y="54"  width="132" height="22" />
  <text class="lbl"  x="102" y="70" text-anchor="end">“down”</text>
  <text class="val"  x="254" y="70">0.22</text>

  <rect class="bar"  x="112" y="88"  width="84"  height="22" />
  <text class="lbl"  x="102" y="104" text-anchor="end">“quietly”</text>
  <text class="val"  x="206" y="104">0.14</text>

  <rect class="bar"  x="112" y="122" width="54"  height="22" />
  <text class="lbl"  x="102" y="138" text-anchor="end">“still”</text>
  <text class="val"  x="176" y="138">0.09</text>

  <rect class="tail" x="112" y="156" width="26"  height="22" />
  <text class="lbl"  x="102" y="172" text-anchor="end">everything else</text>
  <text class="val"  x="148" y="172">0.14</text>

  <text class="lbl" x="110" y="206">probability of being the next token</text>
</svg>
